packages:
  - apps/*
  - packages/*

saveExact: true

# Prebuilt binaries ship as optional dependencies; never compile from source.
allowBuilds:
  '@parcel/watcher': false
  # The Prisma CLI fetches its schema engine on first use, so no install script has to run.
  '@prisma/engines': false
  # tsx's bundler; its prebuilt binary also ships as an optional dependency.
  esbuild: false
  prisma: false

# HazelJS 2.1.3 was published on install day (ADR-0001, 2026-11-22 update); drop once it passes the minimum age.
minimumReleaseAgeExclude:
  - '@hazeljs/agent@2.1.3'
  - '@hazeljs/core@2.1.3'
  - '@hazeljs/eval@2.1.3'
  - '@hazeljs/prompts@2.1.3'
  - '@hazeljs/rag@2.1.3'
  - '@hazeljs/resilience@2.1.3'
  - '@hazeljs/testing@2.1.3'
