# The checks every pull request and every push to main must pass: install, Prettier, the PR title
# (pull requests only), typecheck, lint, Knip, tests with coverage and the gitleaks secret scan.
#
# Serves: NFR-5, NFR-8.
# Used by: GitHub Actions. The job id `ci` is the status check name for branch protection on main.
name: CI

on:
  pull_request:
    # `edited` so that fixing a PR title re-runs the title check.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks lists the commits of the pull request it scans.
  pull-requests: read

jobs:
  # No `name:` here: the status check is named after the job id, and branch protection needs `ci`.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Same image and credentials as docker-compose.yml, for the integration tests (ADR-0002).
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: voxflow
          POSTGRES_PASSWORD: voxflow
          POSTGRES_DB: voxflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxflow -d voxflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://voxflow:voxflow@localhost:5432/voxflow?schema=public

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commits, so it needs the history, not just the tip.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json; pnpm 12 needs v6.1.0 or later.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Cheapest checks first. lint-staged formats on commit, but `--no-verify` skips it.
      - run: pnpm exec prettier --check .
      # The squash commit on main takes the PR title, which the commit-msg hook never sees.
      - if: github.event_name == 'pull_request'
        env:
          # Through env, not ${{ }} in the script: a title must never run as shell code.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      # The client is git-ignored; typecheck, Knip and the tests all import it.
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test:cov

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings go to the job summary, so the token stays read-only.
          GITLEAKS_ENABLE_COMMENTS: false
